services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: outreach
      POSTGRES_DB: outreach
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach"]
      interval: 2s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://outreach:outreach@db:5432/outreach
      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-mock}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
